<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ResQMeal | Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #17233c;
            color: #202735;
        }

        .login-box {
            width: 420px;
            max-width: 90%;
            background: #ffffff;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #17233c;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d6d9df;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #f2a93b;
            color: #17233c;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #fff1f1;
            color: #b33a3a;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #3e506f;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        RESQMEAL
    </div>

    <p class="subtitle">
        Admin Login
    </p>

    <form method="POST">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter Admin username"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter Admin password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    {% if message %}

        <div class="message">
            {{ message }}
        </div>

    {% endif %}

    <a
        href="{{ url_for('auth.login') }}"
        class="back"
    >
        ← Back to Login Options
    </a>

</div>

</body>

</html>
