<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donor Login | ResQMeal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(242, 169, 59, 0.16),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #17233C,
                    #202735
                );
        }

        .container {
            width: 100%;
            max-width: 460px;
        }

        .brand {
            text-align: center;
            color: #F6F7FA;
            margin-bottom: 22px;
        }

        .logo {
            width: 58px;
            height: 58px;

            margin: 0 auto 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid #F2A93B;
            border-radius: 14px;

            background: #202735;

            color: #FFFFFF;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: #F2A93B;
        }

        .brand h1 {
            font-size: 30px;
            letter-spacing: 1px;
        }

        .brand h1 span {
            color: #F2A93B;
        }

        .brand p {
            margin-top: 7px;
            color: #C8CED9;
            font-size: 14px;
        }

        .card {
            background: #F6F7FA;

            border-radius: 20px;

            padding: 34px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.28);
        }

        .card h2 {
            color: #17233C;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #667085;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #17233C;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            border: 1px solid #D6DAE2;
            border-radius: 10px;

            background: #FFFFFF;

            color: #202735;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #F2A93B;

            box-shadow:
                0 0 0 3px rgba(242, 169, 59, 0.16);
        }

        .login-button {
            width: 100%;
            height: 50px;

            margin-top: 5px;

            border: none;
            border-radius: 10px;

            background: #F2A93B;
            color: #17233C;

            font-size: 16px;
            font-weight: 800;

            cursor: pointer;
        }

        .login-button:hover {
            background: #E99D2D;
        }

        .activation {
            margin-top: 24px;
            padding-top: 20px;

            border-top: 1px solid #E1E4E9;

            text-align: center;
        }

        .activation p {
            color: #667085;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .activation a {
            color: #17233C;
            font-weight: 800;
            text-decoration: none;
        }

        .activation a:hover {
            color: #D88E20;
            text-decoration: underline;
        }

        .back-home {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #667085;

            font-size: 13px;

            text-decoration: none;
        }

        .back-home:hover {
            color: #17233C;
        }

        .footer {
            margin-top: 18px;

            text-align: center;

            color: #AEB6C5;

            font-size: 12px;
        }

        @media (max-width: 520px) {

            .card {
                padding: 25px 20px;
            }

            .brand h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- BRAND -->
        <div class="brand">

            <div class="logo">
                R<span>Q</span>
            </div>

            <h1>
                RESQ<span>MEAL</span>
            </h1>

            <p>
                Recover More. Waste Less.
            </p>

        </div>


        <!-- LOGIN CARD -->
        <div class="card">

            <h2>Donor Login</h2>

            <p class="subtitle">
                Sign in to manage your surplus food and recovery activities.
            </p>


            <!-- LOGIN FORM -->

            <form
                method="POST"
                action="/donor/login"
            >

                <div class="form-group">

                    <label for="phone">
                        Registered Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your registered mobile number"
                        autocomplete="tel"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <!-- ACCOUNT ACTIVATION -->

            <div class="activation">

                <p>
                    Haven't activated your donor account yet?
                </p>

                <a href="/donor/activate">
                    Activate Donor Account
                </a>

            </div>


            <!-- HOME -->

            <a
                href="/"
                class="back-home"
            >
                ← Back to ResQMeal Home
            </a>

        </div>


        <div class="footer">
            ResQMeal • AI-Assisted Food Waste Reduction
        </div>

    </div>

</body>
</html>
